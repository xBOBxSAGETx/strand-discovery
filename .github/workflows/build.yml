name: build-and-deploy

on:
  schedule:
    - cron: '17 7 * * *'        # daily, off the top of the hour
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Fail the build on purpose (proves the last deploy stays served)'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Generate catalogs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PREV_SUMMARY_URL: https://xbobxsagetx.github.io/strand-discovery/summary.json
          FORCE_FAIL: ${{ inputs.force_fail && '1' || '0' }}
        run: python generator/build.py out
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
