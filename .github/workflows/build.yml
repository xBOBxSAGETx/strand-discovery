name: build-and-deploy

on:
  schedule:
    - cron: '17 7 * * *'        # daily, off the top of the hour
  workflow_dispatch:
    inputs:
      force_fail:
        description: 'Fail the build on purpose (proves the last deploy stays served)'
        type: boolean
        default: false
      allow_catalog_removal:
        description: 'Accept catalogs removed/renamed on purpose (the >30% item-drop guard still applies)'
        type: boolean
        default: false
      deploy:
        description: 'Deploy to Pages (off = dry run: build + guards + report artifact only)'
        type: boolean
        default: true
      measure_exclusions:
        description: 'Count titles removed by the adult-adjacent keyword rule (extra requests; report only)'
        type: boolean
        default: false

# Staged rollout: repo variables SD_KINDS_OFF / SD_KEEP (Settings > Variables) apply to the daily run too.
# Stage A: SD_KINDS_OFF=director,actor  SD_KEEP=dir-denis-villeneuve  ->  Stage B: both empty.

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read          # restore the first_seen state from the previous run's artifact if the cache is gone
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      # Durable lookups only (movie runtimes, previews by TMDB id); discover pages are always fetched fresh.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: cache
          key: sd-stable-${{ github.run_id }}
          restore-keys: sd-stable-
      # first_seen state ("date first seen on each service"): Actions cache first; if missing, the newest
      # first-seen-state artifact of an earlier run; if neither exists, start fresh (baseline). Never committed.
      - name: Restore first_seen state (cache)
        id: state_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: sd-state-${{ github.run_id }}
          restore-keys: sd-state-
      # The artifact backup is AES-256 encrypted (repo secret SD_STATE_KEY): artifacts of a public repo can be
      # downloaded by any signed-in GitHub user. The cache is not downloadable and stays plain.
      - name: Restore first_seen state (artifact fallback)
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_HIT: ${{ steps.state_cache.outputs.cache-matched-key }}
          SD_STATE_KEY: ${{ secrets.SD_STATE_KEY }}
        run: |
          if [ -n "$CACHE_HIT" ] && [ -f state/first_seen.json.gz ]; then
            echo "SD_STATE_SOURCE=cache:$CACHE_HIT" >> "$GITHUB_ENV"; exit 0
          fi
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=first-seen-state&per_page=20"                    --jq '[.artifacts[] | select(.expired == false)][0].workflow_run.id // empty')
          if [ -z "$run_id" ] || ! gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n first-seen-state -D state-backup; then
            echo "SD_STATE_SOURCE=none (fresh baseline)" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir -p state
          if [ -f state-backup/first_seen.json.gz.enc ] && openssl enc -d -aes-256-cbc -pbkdf2 -pass env:SD_STATE_KEY                -in state-backup/first_seen.json.gz.enc -out state/first_seen.json.gz && gzip -t state/first_seen.json.gz; then
            echo "SD_STATE_SOURCE=artifact:$run_id" >> "$GITHUB_ENV"
          else
            rm -f state/first_seen.json.gz
            echo "::warning::first_seen artifact $run_id could not be decrypted; starting a fresh baseline"
            echo "SD_STATE_SOURCE=none (artifact $run_id undecryptable, fresh baseline)" >> "$GITHUB_ENV"
          fi
      - name: first_seen logger
        id: logger
        continue-on-error: true    # a logger failure must not stop the daily build; New cards fall back
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SD_CACHE: cache
        run: python generator/first_seen.py state
      - name: Save first_seen state (cache)
        if: steps.logger.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: state
          key: sd-state-${{ github.run_id }}
      - name: Encrypt first_seen state for the artifact backup
        id: encrypt
        if: steps.logger.outcome == 'success'
        env:
          SD_STATE_KEY: ${{ secrets.SD_STATE_KEY }}
        run: |
          mkdir -p state-backup
          openssl enc -aes-256-cbc -pbkdf2 -salt -pass env:SD_STATE_KEY             -in state/first_seen.json.gz -out state-backup/first_seen.json.gz.enc
      - name: Save first_seen state (artifact backup)
        if: steps.logger.outcome == 'success' && steps.encrypt.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: first-seen-state
          path: state-backup/first_seen.json.gz.enc
          retention-days: 90
      - name: Generate catalogs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          PREV_SUMMARY_URL: https://xbobxsagetx.github.io/strand-discovery/summary.json
          FORCE_FAIL: ${{ inputs.force_fail && '1' || '0' }}
          ALLOW_CATALOG_REMOVAL: ${{ inputs.allow_catalog_removal && '1' || '0' }}
          SD_KINDS_OFF: ${{ vars.SD_KINDS_OFF }}
          SD_KEEP: ${{ vars.SD_KEEP }}
          SD_CACHE: cache
          SD_MEASURE_EXCLUSIONS: ${{ inputs.measure_exclusions && '1' || '0' }}
          SD_STATE: state
        run: python generator/build.py out
      - name: Run report (always, also on guard failure)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: run-report
          path: |
            out/report.csv
            out/summary.json
            out/exclusions.json
            state/fs_summary.json
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: out

  deploy:
    needs: build
    # Scheduled deploys stay OFF until the Stage A runbook turns them on (repo variable SD_SCHEDULE_DEPLOY=on):
    # AIOStreams re-reads the manifest within 6 h, so an unplanned deploy would add libraries outside the runbook.
    if: (github.event_name == 'schedule' && vars.SD_SCHEDULE_DEPLOY == 'on') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
